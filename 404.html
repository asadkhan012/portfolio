<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Asad Khan</title>
    <meta name="description"
        content="The page you requested could not be found. Return to Asad Khan's web developer portfolio.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0C0C0C">
    <style>
        :root {
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: #0c0c0c;
            color: #d7e2ea;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center
        }

        main {
            max-width: 42rem
        }

        h1 {
            margin: 0;
            color: #bbccd7;
            font-size: clamp(4rem, 16vw, 10rem);
            line-height: .9
        }

        h2 {
            margin: 1.5rem 0 .75rem;
            font-size: clamp(1.5rem, 4vw, 2.5rem)
        }

        p {
            margin: 0 auto 2rem;
            max-width: 32rem;
            line-height: 1.6;
            color: #aab8c1
        }

        a {
            display: inline-block;
            padding: .85rem 1.5rem;
            border: 1px solid #d7e2ea;
            border-radius: 999px;
            color: #fff;
            text-decoration: none;
            font-weight: 700
        }

        a:hover {
            background: #d7e2ea;
            color: #0c0c0c
        }
    </style>
</head>

<body>
    <main>
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you are looking for may have moved or no longer exists.</p>
        <a href="/">Return to homepage</a>
    </main>
</body>

</html>
